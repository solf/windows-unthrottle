# unthrottle settings -- re-read automatically when this file is saved.
# Every key below is required; unthrottle refuses to start if one is missing or invalid.

# Exe names to watch, comma-separated.
processes=java.exe,javaw.exe

# How often to sample CPU usage, in milliseconds.
probe_ms=1000

# Opt a process out of throttling after this many consecutive probes, each at or above
# this many cores busy.
unthrottle_probes=2
unthrottle_cores=0.8

# Hand it back to Windows after it has stayed below reset_cores for reset_seconds.
reset_cores=0.2
reset_seconds=10

# unthrottle.log is renamed to unthrottle.log.1 once it grows past this size.
log_max_kb=1024
